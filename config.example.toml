# 复制为 config.toml 后填写；不要提交含密钥的 config.toml。
#
# 工具面 = Codex 子集：shell + apply_patch（另加 get_current_time / read_artifact）
# 工具授权规则使用 Codex-compatible Starlark 子集：~/.eino-assistant/rules/*.rules，项目层为
# <workspace>/.eino-assistant/rules/*.rules。程序仅在用户层首次创建 default.rules；
# 项目层还须由用户在 ~/.eino-assistant/config.toml 的
# [projects."/absolute/workspace"] 中设 trust_level = "trusted" 才会载入。

approval_policy = "on-request"

[model]
provider = "openai"
base_url = "https://your-openai-endpoint/v1"
api_key = "replace-with-your-api-key"
name = "your-model-name"
# Optional provider/model-specific opaque string; empty preserves the provider default.
reasoning_effort = ""
timeout_seconds = 60

# Optional explicit picker catalog for this endpoint. These are local declared
# values, not live provider discovery; unknown names remain available through
# /model <name> for custom deployments. Aliases resolve to the canonical name
# before provider startup and durable session metadata is written.
# [[model.catalog]]
# name = "your-model-name"
# display_name = "Primary coding model"
# aliases = ["primary"]
# description = "Configured deployment for general coding"
# lifecycle = "active" # active | deprecated | retired
#
# [model.catalog.capabilities]
# context_window_tokens = 128000
# max_output_tokens = 8192
# supports_reasoning = true
# reasoning_efforts = ["low", "medium", "high"]
# input_modalities = ["text", "image"]
# supports_tools = true
# supports_streaming = true

[model.context]
window_tokens = 32000
max_output_tokens = 4096
keep_recent_turns = 12
auto_compact_trigger_percent = 75
post_compact_target_percent = 45
summary_max_tokens = 2048
max_low_gain_attempts = 2
low_gain_threshold_percent = 15

[model.pricing]
input_per_million = 0.0
output_per_million = 0.0

[assistant]
system_prompt = "你是一个严谨、实用的编程助手。"

[workspace]
root = ""

# 默认 workspace-write：shell 与 apply_patch 在短生命周期 worker 中运行，
# 只能修改 workspace；read-only 会将 workspace 以只读方式暴露。
[sandbox]
mode = "workspace-write"
# 仅接受已存在的绝对目录；按真实路径规范化后以只读方式挂载。
# read_only_roots = ["/absolute/path/to/go-or-node-toolchain"]
# 这里只能追加字面工作区路径或字面 `/**` 子树；内建 .git、.agents、.eino-assistant、.eino、.env 永远受保护。
# protected_paths = [".env.local", "secrets/**"]

# 空列表表示无网络。仅允许精确 DNS 主机名（不接受 URL、端口、IP 或通配符）。
# [sandbox.network]
# allowed_domains = ["proxy.golang.org", "registry.npmjs.org"]

# 单个 agent turn 的总预算；0 也会采用下列默认值。
# 一个 tool-enabled 模型响应计一个 model step；该响应中的 0..N 个工具调用
# 仍独立计入 tool-call 预算，并可并行执行。
[runtime]
max_turn_seconds = 600
max_model_steps = 8
max_tool_calls = 16
# 同一 tool name + 规范化 JSON 参数在实际工作区/外部状态改变前最多执行 3 次；
# 第 4 次会被拒绝。非零值不得超过 max_tool_calls。
max_consecutive_equivalent_tool_calls = 3

# [tools.shell]
# timeout_seconds = 60
# max_output_bytes = 65536
#
# [tools.apply_patch]
# max_bytes = 262144

[storage]
data_dir = ""

# Project instructions + semantic memory (not session resume).
[rules]
enabled = true
# workspace root: AGENTS.override.md, then AGENTS.md; symlinks allowed; blank content skipped
# Optional project-only fallback basenames, tried in order after both canonical candidates are invalid.
# Each discovered directory contributes at most one file; this is read when a fresh session is created.
# project_doc_fallback_filenames = ["CLAUDE.md", "CONVENTIONS.md"]
# max_tokens = 8000
# user home (~/.eino-assistant): override, then base; independent soft-context budget
# global_max_tokens = 4000

[memory]
enabled = true              # inject summary + expose memory_* read tools
generate = true             # idle auto-extract candidates from session journals
# max_summary_tokens = 2500
# idle_after = "6h"
# max_rollouts_per_scan = 2
# scan_max_age = "10d"
