# 安装脚本会将本文件复制到 ~/.eino-assistant/config.toml；不要提交含密钥的 config.toml。
# 运行时始终读取该用户级文件，不会自动加载当前项目的 config.toml。
#
# 工具面 = Codex 子集：shell + apply_patch（另加 get_current_time / read_artifact）
# 工具授权规则使用 Codex-compatible Starlark 子集：~/.eino-assistant/rules/*.rules，项目层为
# <workspace>/.eino-assistant/rules/*.rules。程序仅在用户层首次创建 default.rules；
# 项目层还须由用户在 ~/.eino-assistant/config.toml 的
# [projects."/absolute/workspace"] 中设 trust_level = "trusted" 才会载入。

approval_policy = "on-request"

[model]
provider = "openai"
base_url = "https://your-openai-endpoint/v1"
api_key = "replace-with-your-api-key"
name = "your-model-name"
# Sent on every request. Omit it to use the same "medium" default.
reasoning_effort = "medium"
timeout_seconds = 60

# Optional explicit picker catalog for this endpoint. These are local declared
# values, not live provider discovery; unknown names remain available through
# /model <name> for custom deployments. Aliases resolve to the canonical name
# before provider startup and durable session metadata is written.
# [[model.catalog]]
# name = "your-model-name"
# display_name = "Primary coding model"
# aliases = ["primary"]
# description = "Configured deployment for general coding"
# lifecycle = "active" # active | deprecated | retired
#
# [model.catalog.capabilities]
# context_window_tokens = 128000
# supports_reasoning = true
# reasoning_efforts = ["low", "medium", "high"]
# default_reasoning_effort = "medium"
# input_modalities = ["text", "image"]
# supports_tools = true
# supports_streaming = true

[model.context]
window_tokens = 32000
# This is the only context setting. The product owns request admission and
# checkpoint policy so every session follows the same recoverable contract.

[model.pricing]
input_per_million = 0.0
output_per_million = 0.0

# Persistent status-line fields, also configurable interactively with
# /statusline. `activity` shows live states such as thinking, streaming,
# tool execution, compaction, and pending approval.
[ui]
# "mode" is enabled by default and shows the concise ask|auto|plan|yolo state.
# status_line = ["model-with-reasoning", "context-used", "used-tokens", "task-progress", "activity", "mode"]

[workspace]
root = ""

# 默认关闭 OS sandbox；需要时显式设置 mode = "workspace-write" 或 "read-only"。
# workspace-write 只能修改 workspace；read-only 会将 workspace 以只读方式暴露。
[sandbox]
# mode = "workspace-write" # workspace-write | read-only
# 默认自动发现宿主工具链 PATH、符号链接目标和依赖缓存并以只读方式挂载。
# 高安全场景可设为 explicit，仅使用手动配置的 read_only_roots。
toolchain_visibility = "auto" # auto | explicit
# 仅接受已存在的绝对目录；按真实路径规范化后以只读方式挂载。
# read_only_roots = ["/absolute/path/to/go-or-node-toolchain"]
# 这里只能追加字面工作区路径或字面 `/**` 子树；内建 .git、.agents、.eino-assistant、.eino、.env 永远受保护。
# protected_paths = [".env.local", "secrets/**"]

# sandbox 只限制文件系统，网络始终开放；不需要 network 参数。

# 单个 agent turn 的总预算；0 也会采用下列默认值。
# 一个 tool-enabled 模型响应计一个 model step；该响应中的 0..N 个工具调用
# 仍独立计入 tool-call 预算，并可并行执行。
[runtime]
max_turn_seconds = 600
max_model_steps = 8
max_tool_calls = 16
# 同一 tool name + 规范化 JSON 参数在实际工作区/外部状态改变前最多执行 3 次；
# 第 4 次会被拒绝。非零值不得超过 max_tool_calls。
max_consecutive_equivalent_tool_calls = 3

# [tools.shell]
# timeout_seconds = 60
# max_output_bytes = 65536
#
# [tools.apply_patch]
# max_bytes = 262144

[storage]
data_dir = ""

# MCP configuration is static: `eino mcp list` displays these entries without
# starting a process or printing environment values.
# [[mcp.servers]]
# name = "local-tools"
# command = "npx"
# args = ["-y", "@example/mcp-server"]
# working_dir = "/absolute/workspace"
# enabled = true
# connect_timeout_seconds = 15
#
# [mcp.servers.env]
# API_TOKEN = "replace-with-your-token"

# Process diagnostics (log/slog). Session journals remain the product ledger;
# these files are operational only and never replace resume/replay.
[logging]
# enabled = true                 # default true; set false to disable all process logs
# level = "info"                 # debug | info | warn | error; EINO_LOG_LEVEL overrides
# dir = ""                       # empty => <storage.data_dir>/logs (daily eino-YYYY-MM-DD.log)
# format = "json"                # json | text
# stderr = false                 # keep false for TUI; true mirrors structured logs to stderr
# retention_days = 7             # prune older daily files; negative disables pruning
# add_source = false             # attach caller file:line (noisy)

# Project instructions + semantic memory (not session resume).
[rules]
enabled = true
# workspace root: AGENTS.override.md, then AGENTS.md; symlinks allowed; blank content skipped
# Optional project-only fallback basenames, tried in order after both canonical candidates are invalid.
# Each discovered directory contributes at most one file; this is read when a fresh session is created.
# project_doc_fallback_filenames = ["CLAUDE.md", "CONVENTIONS.md"]
# max_tokens = 8000
# user home (~/.eino-assistant): override, then base; independent soft-context budget
# global_max_tokens = 4000

[memory]
enabled = true              # inject summary + expose memory_* read tools
generate = true             # idle auto-extract candidates from session journals
# max_summary_tokens = 2500
# idle_after = "6h"
# max_rollouts_per_scan = 2
# scan_max_age = "10d"

# 项目规则只会在用户显式信任后加载。该记录与模型设置同在用户级配置中，
# 不能由项目自身的文件授予。
# [projects."/absolute/workspace"]
# trust_level = "trusted"
