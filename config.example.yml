# 复制为 config.yml 后填写本地模型服务信息；不要提交真实 config.yml。
model:
  base_url: "https://your-compatible-endpoint/v1"
  api_key: "replace-with-your-api-key"
  name: "your-model-name"
  timeout_seconds: 60

assistant:
  system_prompt: "你是一个严谨、实用的编程助手。"

# 可选。thread 账本目录；留空则使用 ~/.eino-assistant
storage:
  data_dir: ""

# 可选。模型工作上下文；原始 thread 事件和工具 artifact 不会被 compact 改写。
context:
  model_context_tokens: 32000
  output_reserve_tokens: 4096
  keep_recent_turns: 12
  auto_compact_trigger_percent: 75
  post_compact_target_percent: 45
  summary_max_tokens: 2048
  max_low_gain_attempts: 2
  low_gain_threshold_percent: 15

# 可选。费用展示用（USD / 百万 tokens）；不配则只显示 token 数、费用为 $0
pricing:
  input_per_million: 0
  output_per_million: 0

# 可选。内置 agent 工具；默认开启本地 shell 命令执行（无交互审批）。
# tools:
#   run_command:
#     disabled: false
#     timeout_seconds: 60      # 0 = 默认 60；单次调用上限 300
#     max_output_bytes: 65536  # 0 = 默认 64KiB；stdout/stderr 各自上限
#     working_dir: ""          # 空 = 进程 cwd
